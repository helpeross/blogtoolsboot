# ============================================================
# TBblog Tech Blog — Hugo / PaperMod configuration
# Site: https://blog.toolsboot.com/
# ============================================================

baseURL = "https://blog.toolsboot.com/"
locale = "en-us"
title = "TBblog"
theme = "PaperMod"

enableRobotsTXT = true
enableEmoji = true
pygmentsUseClasses = true

# 每页文章数
[pagination]
  pagerSize = 8

[params]
  env = "production"
  title = "TBblog"
  description = "Practical guides, reviews and buying advice for IT hardware, consumer electronics and everyday tech gadgets."
  keywords = ["tech blog", "electronics review", "IT hardware", "gadget guide", "buying guide", "Amazon deals"]
  author = "TBblog Editorial Team"
  DateFormat = "January 2, 2006"
  defaultTheme = "auto"          # light / dark / auto
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

  # Amazon Associates tag（替换为你自己的联盟 tag）
  amazonTag = "toolsboot-20"

  # 站点标识（炭黑方块 + 橙色 TB）
  [params.label]
    text = "TBblog"
    iconSVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="28" height="28" fill="none"><rect width="32" height="32" rx="6" fill="#0f0f0f"/><text x="16" y="21" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#ff6b1a" text-anchor="middle">TB</text></svg>'

  # 全文搜索（PaperMod 内置 Fuse.js）
  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

  # 站点图标（替换为你的图标后启用）
  # [params.assets]
  #   favicon = "/favicon.ico"
  #   apple_touch = "/apple-touch-icon.png"

  # 社会化图标（可选）
  # socialIcons = [
  #   { name = "github", url = "https://github.com/yourname" },
  #   { name = "x", url = "https://x.com/yourname" },
  # ]

[[menu.main]]
    identifier = "posts"
    name = "Reviews"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
    weight = 20
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 30
  [[menu.main]]
    identifier = "contact"
    name = "Contact"
    url = "/contact/"
    weight = 40
  [[menu.main]]
    identifier = "disclosure"
    name = "Disclosure"
    url = "/affiliate-disclosure/"
    weight = 50

# 主页输出 JSON 供站内搜索使用
[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true   # 允许内联 HTML（表格、按钮等）
